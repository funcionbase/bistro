# Caller mínimo del guard de versionado. La lógica vive en el reusable
# de apps-bistro-co (workflow.md §6): falla el push si cambió código
# desplegable sin bump de version y autosincroniza los badges del README.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version-guard:
    uses: cristianmarint/apps-bistro-co/.github/workflows/version-guard.yml@main
