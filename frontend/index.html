        <!-- Anti-FOUC de tema: aplica `.dark` al <html> ANTES de que cargue el
             CSS, replicando la semántica de initializeTheme (use-appearance):
             dark si appearance === 'dark' o ('system' y el SO prefiere oscuro).
             Sin esto, un usuario en dark veía un flash claro en cada carga. -->
        <script>
            (function () {
                try {
                    var a = localStorage.getItem('appearance') || 'system';
                    if (a === 'dark' || (a === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {
                    /* sin storage: queda light e initializeTheme corrige al hidratar */
                }
            })();
        </script>

        <!-- black-translucent: la barra de estado iOS queda transparente y el
             body (bg-background, sigue la clase .dark) pinta debajo — sin esto
             iOS dibuja una franja blanca opaca en dark mode. Requiere
             viewport-fit=cover + pwa-safe-top en barras superiores. -->

        <!-- Async: `preload` + swap a stylesheet en `onload` evita que el CSS
             remoto bloquee el render mientras descarga (era render-blocking
             puro con `rel=stylesheet` directo). `display=swap` evita el
             periodo de texto invisible mientras carga la fuente. -->
        <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600&display=swap"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript><link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600&display=swap" rel="stylesheet" /></noscript>

        <!-- Brand font (logo wordmark, titulares de auth). -->
        <link rel="preload" href="/fonts/FlexyFont.woff2" as="font" type="font/woff2" crossorigin />

    <body class="font-sans antialiased">
        <!-- Intro de carga de la landing (estilo heyfriends.studio): vive en el
             shell para pintar con el PRIMER byte — el tiempo de la animación
             cubre la descarga/hidratación del bundle. Solo en `/`, se salta con
             prefers-reduced-motion, exit cuando la app avisa (window.__introReady)
             con mínimo de exhibición y fallback duro a 4s. -->
        <style>
            #intro-shell {
                position: fixed;
                inset: 0;
                z-index: 60;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0052ff;
            }
            #intro-shell .intro-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                animation: intro-logo-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
            }
            #intro-shell svg {
                height: 48px;
                width: auto;
            }
            #intro-shell .intro-bar {
                height: 10px;
                width: 64px;
                border-radius: 999px;
                background: #c0fd79;
                animation: intro-plate-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
            }
            #intro-shell.intro-exit {
                /* transform + opacity (compositables) en vez de clip-path:
                   Lighthouse marca clip-path como "non-composited animation"
                   (fuerza main thread). Cambia el efecto de cortina redondeada
                   a slide-up + fade, visualmente distinto pero igual de limpio. */
                animation: intro-exit 0.55s cubic-bezier(0.65, 0, 0.35, 1) forwards;
                will-change: transform, opacity;
            }
            /* Variante post-login: verde branding con tinta oscura. */
            #intro-shell.intro-green {
                background: #c0fd79;
            }
            #intro-shell.intro-green svg g {
                fill: #1e232e;
            }
            #intro-shell.intro-green .intro-bar {
                background: #0052ff;
            }
            @keyframes intro-logo-pop {
                0% {
                    opacity: 0;
                    transform: scale(0.82) translateY(14px);
                }
                55% {
                    opacity: 1;
                    transform: scale(1.04) translateY(0);
                }
                100% {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }
            @keyframes intro-plate-pop {
                0% {
                    transform: scale(0);
                }
                70% {
                    transform: scale(1.12);
                }
                100% {
                    transform: scale(1);
                }
            }
            @keyframes intro-exit {
                from {
                    transform: translateY(0);
                    opacity: 1;
                }
                to {
                    transform: translateY(-100%);
                    opacity: 0;
                }
            }
            @media (min-width: 768px) {
                #intro-shell svg {
                    height: 56px;
                }
            }
        </style>
        <div id="intro-shell" aria-hidden="true">
            <div class="intro-inner">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2680 940" fill="none" role="img" aria-label="bistro">

        <script>
            (function () {
                var el = document.getElementById('intro-shell');
                if (!el) return;
                // Flag de un solo uso: la carga inmediatamente posterior a un
                // login exitoso muestra la variante verde en cualquier ruta.
                var postLogin = false;
                try {
                    postLogin = sessionStorage.getItem('ff.intro') === 'green';
                    if (postLogin) sessionStorage.removeItem('ff.intro');
                } catch (e) {
                    /* sin storage */
                }
                // Solo la landing (o post-login) y solo si el usuario acepta movimiento.
                if ((window.location.pathname !== '/' && !postLogin) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    el.remove();
                    return;
                }
                if (postLogin) el.classList.add('intro-green');
                var t0 = Date.now();
                var MIN_SHOW = 1100; // que la animación respire aunque la app cargue al instante
                var exited = false;
                function exit() {
                    if (exited) return;
                    exited = true;
                    el.classList.add('intro-exit');
                    el.addEventListener('animationend', function (e) {
                        if (e.animationName === 'intro-exit') el.remove();
                    });
                    // por si animationend no dispara (tab oculta, etc.)
                    setTimeout(function () {
                        el.remove();
                    }, 900);
                }
                window.__introReady = function () {
                    var elapsed = Date.now() - t0;
                    setTimeout(exit, Math.max(0, MIN_SHOW - elapsed));
                };
                // Fallback duro: nunca dejar la cortina pegada.
                setTimeout(exit, 4000);
            })();
        </script>
        <div id="spa-root"></div>
        <script type="module" src="/src/spa/main.tsx"></script>
