<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Mirá el menú y hacé tu pedido">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.55" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7F1D1D" flood-opacity="0.35"/>
    </filter>
    <style>
      .h { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; }
      .m { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Plato con cubiertos (motivo de comida) -->
  <g filter="url(#soft)" transform="translate(880 315)">
    <circle r="205" fill="#FFF7ED"/>
    <circle r="150" fill="none" stroke="#FDBA74" stroke-width="6"/>
    <!-- vapor / bocado apetitoso -->
    <path d="M-70 -18 C -40 -70 40 -70 70 -18 C 92 22 40 78 0 78 C -40 78 -92 22 -70 -18 Z" fill="#F97316"/>
    <circle cx="-22" cy="6" r="14" fill="#FFEDD5"/>
    <circle cx="26" cy="18" r="10" fill="#FFEDD5"/>
    <circle cx="4" cy="-24" r="8" fill="#FFEDD5"/>
  </g>
  <!-- Texto -->
  <text x="90" y="150" class="m" font-size="30" letter-spacing="4" fill="#FFE4CC">MENÚ DIGITAL</text>
  <text x="88" y="270" class="h" font-size="92" fill="#FFFFFF">Mirá el menú</text>
  <text x="88" y="376" class="h" font-size="92" fill="#FFFFFF">y hacé tu pedido</text>
  <text x="90" y="452" class="m" font-size="38" fill="#FFEAD5">Pedí online en segundos, sin filas.</text>

  <!-- CTA pill -->
  <g transform="translate(90 500)">
    <rect width="326" height="72" rx="36" fill="#FFFFFF"/>
    <text x="163" y="47" text-anchor="middle" class="h" font-size="34" fill="#C2410C">Ver menú y pedir →</text>
  </g>

  <!-- Firma sutil -->
  <text x="90" y="600" class="m" font-size="24" fill="#FFFFFF" opacity="0.75">con bistro</text>
</svg>
