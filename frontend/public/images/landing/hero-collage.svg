<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 720" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0052ff"/>
      <stop offset="0.55" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#c0fd79"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e232e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1030" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="920" cy="80" r="180" fill="#ffffff" opacity="0.07"/>
  <circle cx="140" cy="660" r="220" fill="#1e232e" opacity="0.06"/>

  <!-- Chips timer KDS -->
  <g filter="url(#sh)">
    <rect x="380" y="34" width="74" height="36" rx="18" fill="#1e232e"/>
    <text x="417" y="58" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">3:05</text>
    <rect x="462" y="34" width="74" height="36" rx="18" fill="#f39c12"/>
    <text x="499" y="58" fill="#1e232e" font-size="17" font-weight="700" text-anchor="middle">7:40</text>
    <rect x="544" y="34" width="74" height="36" rx="18" fill="#c0fd79"/>
    <text x="581" y="58" fill="#1e232e" font-size="17" font-weight="700" text-anchor="middle">1:12</text>
  </g>

  <!-- Notificación pedido QR -->
  <g transform="translate(700 44) rotate(2)" filter="url(#sh)">
    <rect width="280" height="64" rx="32" fill="#ffffff"/>
    <circle cx="34" cy="32" r="18" fill="#0052ff"/>
    <text x="34" y="38" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">M8</text>
    <text x="62" y="27" fill="#1e232e" font-size="15" font-weight="700">Nuevo pedido QR</text>
    <text x="62" y="48" fill="#6b7280" font-size="14">Mesa 8 · 2 productos</text>
  </g>

  <!-- Ticket cocina (KDS) -->
  <g transform="translate(52 92) rotate(-4)" filter="url(#sh)">
    <rect width="300" height="180" rx="18" fill="#1e232e"/>
    <text x="24" y="40" fill="#ffffff" font-size="19" font-weight="700">Cocina · Pedido #128</text>
    <text x="24" y="64" fill="#9ca3af" font-size="14">Mesa 4 · hace 3 min</text>
    <text x="24" y="98" fill="#e5e7eb" font-size="15">1× Bandeja paisa</text>
    <text x="24" y="124" fill="#e5e7eb" font-size="15">2× Limonada de coco</text>
    <rect x="24" y="140" width="132" height="28" rx="14" fill="#f39c12"/>
    <text x="90" y="159" fill="#1e232e" font-size="13" font-weight="700" text-anchor="middle">En preparación</text>
  </g>

  <!-- Cuenta / pago -->
  <g transform="translate(248 236) rotate(-2)" filter="url(#sh)">
    <rect width="380" height="266" rx="18" fill="#ffffff"/>
    <text x="26" y="42" fill="#1e232e" font-size="20" font-weight="700">Mesa 4 · Cuenta</text>
    <line x1="26" y1="60" x2="354" y2="60" stroke="#e5e7eb" stroke-width="2"/>
    <text x="26" y="92" fill="#374151" font-size="15">1× Bandeja paisa</text>
    <text x="354" y="92" fill="#374151" font-size="15" text-anchor="end">$32.000</text>
    <text x="26" y="120" fill="#374151" font-size="15">2× Limonada de coco</text>
    <text x="354" y="120" fill="#374151" font-size="15" text-anchor="end">$18.000</text>
    <text x="26" y="148" fill="#374151" font-size="15">1× Arepa de chócolo</text>
    <text x="354" y="148" fill="#374151" font-size="15" text-anchor="end">$9.500</text>
    <line x1="26" y1="168" x2="354" y2="168" stroke="#e5e7eb" stroke-width="2"/>
    <text x="26" y="200" fill="#1e232e" font-size="18" font-weight="700">Total</text>
    <text x="354" y="200" fill="#1e232e" font-size="18" font-weight="700" text-anchor="end">$59.500</text>
    <rect x="26" y="218" width="150" height="30" rx="15" fill="#22c55e"/>
    <text x="101" y="238" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Pago aprobado ✓</text>
  </g>

  <!-- Ventas de hoy -->
  <g transform="translate(650 128) rotate(3)" filter="url(#sh)">
    <rect width="320" height="240" rx="18" fill="#ffffff"/>
    <text x="24" y="40" fill="#1e232e" font-size="19" font-weight="700">Ventas de hoy</text>
    <text x="24" y="72" fill="#0052ff" font-size="26" font-weight="800">$1.240.500</text>
    <rect x="30" y="150" width="34" height="50" rx="6" fill="#0052ff" opacity="0.35"/>
    <rect x="86" y="130" width="34" height="70" rx="6" fill="#0052ff" opacity="0.5"/>
    <rect x="142" y="140" width="34" height="60" rx="6" fill="#0052ff" opacity="0.7"/>
    <rect x="198" y="110" width="34" height="90" rx="6" fill="#0052ff"/>
    <rect x="254" y="94" width="34" height="106" rx="6" fill="#c0fd79" stroke="#1e232e" stroke-width="2"/>
    <text x="47" y="222" fill="#6b7280" font-size="13" text-anchor="middle">L</text>
    <text x="103" y="222" fill="#6b7280" font-size="13" text-anchor="middle">M</text>
    <text x="159" y="222" fill="#6b7280" font-size="13" text-anchor="middle">X</text>
    <text x="215" y="222" fill="#6b7280" font-size="13" text-anchor="middle">J</text>
    <text x="271" y="222" fill="#6b7280" font-size="13" text-anchor="middle">V</text>
  </g>

  <!-- Mesa con QR -->
  <g transform="translate(58 486) rotate(2)" filter="url(#sh)">
    <rect width="300" height="190" rx="18" fill="#c0fd79"/>
    <text x="24" y="46" fill="#1e232e" font-size="26" font-weight="800">Mesa 12</text>
    <text x="24" y="76" fill="#1e232e" font-size="13.5">Tus clientes piden</text>
    <text x="24" y="96" fill="#1e232e" font-size="13.5">con QR</text>
    <rect x="24" y="114" width="120" height="30" rx="15" fill="#1e232e"/>
    <text x="84" y="134" fill="#c0fd79" font-size="13" font-weight="700" text-anchor="middle">Sin apps</text>
    <g transform="translate(186 62)" fill="#1e232e">
      <rect width="100" height="100" rx="10" fill="#ffffff"/>
      <rect x="12" y="12" width="24" height="24" rx="3"/>
      <rect x="64" y="12" width="24" height="24" rx="3"/>
      <rect x="12" y="64" width="24" height="24" rx="3"/>
      <rect x="46" y="12" width="9" height="9"/>
      <rect x="46" y="30" width="9" height="9"/>
      <rect x="46" y="48" width="9" height="9"/>
      <rect x="64" y="48" width="9" height="9"/>
      <rect x="82" y="48" width="9" height="9"/>
      <rect x="12" y="48" width="9" height="9"/>
      <rect x="30" y="48" width="9" height="9"/>
      <rect x="46" y="66" width="9" height="9"/>
      <rect x="64" y="66" width="9" height="9"/>
      <rect x="82" y="66" width="9" height="9"/>
      <rect x="46" y="84" width="9" height="9"/>
      <rect x="82" y="84" width="9" height="9"/>
    </g>
  </g>

  <!-- Alertas de inventario -->
  <g transform="translate(596 444) rotate(-3)" filter="url(#sh)">
    <rect width="380" height="220" rx="18" fill="#ffffff"/>
    <text x="26" y="42" fill="#1e232e" font-size="19" font-weight="700">Inventario</text>
    <rect x="272" y="22" width="84" height="28" rx="14" fill="#d9402a"/>
    <text x="314" y="41" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3 alertas</text>
    <circle cx="34" cy="84" r="6" fill="#f39c12"/>
    <text x="52" y="89" fill="#374151" font-size="15">Queso campesino · quedan 2 kg</text>
    <circle cx="34" cy="122" r="6" fill="#d9402a"/>
    <text x="52" y="127" fill="#374151" font-size="15">Aguacate · agotado</text>
    <circle cx="34" cy="160" r="6" fill="#22c55e"/>
    <text x="52" y="165" fill="#374151" font-size="15">Café de origen · en nivel</text>
    <line x1="26" y1="182" x2="354" y2="182" stroke="#e5e7eb" stroke-width="2"/>
    <text x="26" y="205" fill="#0052ff" font-size="14" font-weight="700">Pedir a proveedor →</text>
  </g>
</svg>
