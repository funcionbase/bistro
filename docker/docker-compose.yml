services:
    db:
        image: postgres:15-alpine
        container_name: laravel_db
        restart: always
        environment:
            - POSTGRES_DB=laravel_app
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=root
        ports:
            - "5432:5432"
        volumes:
            - ./postgres-data:/var/lib/postgresql/data

    # MinIO: S3-compatible local storage. Mirrors AWS S3 buckets used in qa/pdn
    # (flexyflow-restaurante-{env}-assets, flexyflow-restaurante-{env}-documents).
    # See docker/README.md and issue #43 (T7).
    minio:
        image: minio/minio:latest
        container_name: flexyflow_minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            - MINIO_ROOT_USER=minioadmin
            - MINIO_ROOT_PASSWORD=minioadmin
        ports:
            - "9000:9000"   # S3 API
            - "9001:9001"   # Web console (http://localhost:9001)
        volumes:
            - ./minio-data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 3

    # Bootstrap: creates the two buckets the app expects, marks the assets
    # bucket as publicly readable, and uploads a .health marker that
    # HealthController::ready() will probe.
    minio-bootstrap:
        image: minio/mc:latest
        container_name: flexyflow_minio_bootstrap
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin &&
            mc mb -p local/flexyflow-restaurante-local-assets &&
            mc mb -p local/flexyflow-restaurante-local-documents &&
            mc anonymous set download local/flexyflow-restaurante-local-assets &&
            echo ok | mc pipe local/flexyflow-restaurante-local-assets/.health &&
            echo ok | mc pipe local/flexyflow-restaurante-local-documents/.health &&
            echo 'Buckets ready: assets (public download), documents (private)' &&
            exit 0
            "

    # pgweb: GUI web liviana para la BD local. Autoconecta vía DATABASE_URL,
    # sin login. http://localhost:8081 una vez levantado.
    # Bind a 127.0.0.1 para no exponer credenciales en la LAN.
    pgweb:
        image: sosedoff/pgweb:latest
        container_name: flexyflow_pgweb
        restart: unless-stopped
        depends_on:
            - db
        environment:
            - PGWEB_DATABASE_URL=postgres://postgres:root@db:5432/laravel_app?sslmode=disable
        ports:
            - "127.0.0.1:8081:8081"
