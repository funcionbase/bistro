services:
    # Postgres 15 — stack canónico (CLAUDE.md §12: TODO sobre PostgreSQL,
    # sin Redis/SQS/SQLite). Mismas extensiones que Supabase pdn:
    # pgcrypto (gen_random_uuid) viene built-in desde PG 13.
    #
    # Para usar desde el host: aplica este bloque al `.env` del backend
    # (`application/backend/.env`):
    #   DB_CONNECTION=pgsql
    #   DB_HOST=127.0.0.1
    #   DB_PORT=5432
    #   DB_DATABASE=laravel_app
    #   DB_USERNAME=postgres
    #   DB_PASSWORD=root
    # Levantar: docker compose up -d db
    db:
        image: postgres:15-alpine
        container_name: laravel_db
        restart: always
        environment:
            - POSTGRES_DB=laravel_app
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=root
        ports:
            - "5432:5432"
        volumes:
            - ./postgres-data:/var/lib/postgresql/data
        # Healthcheck: pg_isready confirma que postgres acepta conexiones.
        # Otros servicios pueden `depends_on: { db: { condition: service_healthy } }`
        # para esperar a que esté listo en vez de race con el bootstrap inicial.
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d laravel_app"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    # MinIO: S3-compatible local storage. Mirrors AWS S3 buckets used in qa/pdn
    # (flexyflow-panel-{env}-assets, flexyflow-panel-{env}-documents).
    # See docker/README.md and issue #43 (T7).
    minio:
        image: minio/minio:latest
        container_name: flexyflow_minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            - MINIO_ROOT_USER=minioadmin
            - MINIO_ROOT_PASSWORD=minioadmin
        ports:
            - "9000:9000"   # S3 API
            - "9001:9001"   # Web console (http://localhost:9001)
        volumes:
            - ./minio-data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 3

    # Bootstrap: creates the two buckets the app expects, marks the assets
    # bucket as publicly readable, and uploads a .health marker that
    # HealthController::ready() will probe.
    #
    # Idempotente: cada subcomando verifica si la acción ya está aplicada
    # antes de ejecutar. Cuando los buckets ya existen, los logs muestran
    # solo "Bootstrap idempotente: nada que hacer" en lugar del falso
    # positivo "Bucket created successfully" en cada `docker compose up`.
    minio-bootstrap:
        image: minio/mc:latest
        container_name: flexyflow_minio_bootstrap
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            set -e;
            mc alias set local http://minio:9000 minioadmin minioadmin > /dev/null;
            changed=0;
            if ! mc ls local/flexyflow-panel-local-assets > /dev/null 2>&1; then
              mc mb local/flexyflow-panel-local-assets;
              mc anonymous set download local/flexyflow-panel-local-assets;
              echo ok | mc pipe local/flexyflow-panel-local-assets/.health > /dev/null;
              changed=1;
            fi;
            if ! mc ls local/flexyflow-panel-local-documents > /dev/null 2>&1; then
              mc mb local/flexyflow-panel-local-documents;
              echo ok | mc pipe local/flexyflow-panel-local-documents/.health > /dev/null;
              changed=1;
            fi;
            if [ \"$$changed\" = \"1\" ]; then
              echo 'Buckets ready: assets (public download), documents (private)';
            else
              echo 'Bootstrap idempotente: nada que hacer (buckets ya existen).';
            fi;
            exit 0
            "

    # pgweb: GUI web liviana para la BD local. Autoconecta vía DATABASE_URL,
    # sin login. http://localhost:8081 una vez levantado.
    # Bind a 127.0.0.1 para no exponer credenciales en la LAN.
    pgweb:
        image: sosedoff/pgweb:latest
        container_name: flexyflow_pgweb
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            - PGWEB_DATABASE_URL=postgres://postgres:root@db:5432/laravel_app?sslmode=disable
        ports:
            - "127.0.0.1:8081:8081"
